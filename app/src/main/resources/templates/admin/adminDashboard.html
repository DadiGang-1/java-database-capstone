<!-- adminDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <link rel="icon" type="image/png" href="../../static/assets/images/logo/logo.png" th:href="@{/assets/images/logo/logo.png}" />
    <link rel="stylesheet" href="../../static/assets/css/adminDashboard.css" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" href="../../static/assets/css/style.css" th:href="@{/assets/css/style.css}">

    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>

</head>

<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <main class="main-content">
                <label for="searchBar">searchBar</label>
                <input type="text" id="searchBar" placeholder="search by doctor name" />
                <label for="filter">filter</label>
                <select name="filter" id="filter">
                    <option value="">filter</option>
                    <option value="time">time</option>
                    <option value="specialty">specialty</option>
                </select>
                <div id="content"></div>
            </main>
            <div id="footer"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <span id="closeModal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>

    <script type="module" src="../js/services/adminDashboard.js" defer></script>
    <script type="module" src="../js/components/doctorDashboard.js" defer></script>
    <script type="module" src="../js/components/doctorCard.js" defer></script>
</body>
</html>

15. Add Filter Dropdowns

    * Use two `<select>` elements:
      - One for time (AM/PM).
      - One for filtering by medical specialty (Cardiologist, Dentist, etc.).
